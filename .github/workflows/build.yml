name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  CORE_PROJECT: Core/Core.csproj
  GUI_PROJECT: Gui/Gui.csproj
  NUGET_ENABLE_ENHANCED_HTTP_RETRY: "true"
  NUGET_ENHANCED_MAX_NETWORK_TRY_COUNT: "6"
  NUGET_ENHANCED_NETWORK_RETRY_DELAY_MILLISECONDS: "2000"

jobs:
  # Runs first: every project changed since the last main commit must have bumped its csproj <Version>
  version-check:
    uses: ./.github/workflows/version-check.yml

  release:
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from Core.csproj
        id: version
        run: |
          set -euo pipefail
          version=$(grep -oPm1 '(?<=<Version>)[^<]+' "$CORE_PROJECT" || true)
          if [ -z "$version" ]; then
            echo "::error::No <Version> element found in $CORE_PROJECT"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Fail if version already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists. Bump <Version> in Core.csproj."
            exit 1
          fi
          if gh release list --limit 1000 --json tagName,name \
               --jq '.[] | select(.tagName == "'"$tag"'" or .name == "'"$tag"'") | .tagName' \
               | grep -q .; then
            echo "::error::A release for $tag already exists (possibly a draft). Bump <Version> in Core.csproj."
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build and package all platforms
        run: |
          set -euo pipefail

          retry() {
            local n=0
            until "$@"; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then return 1; fi
              echo "::warning::Command failed, retry $n/3: $*"
              sleep $((n*15))
            done
          }

          COMMON_PROPS="-p:DebugType=None -p:DebugSymbols=false -p:SatelliteResourceLanguages=en"
          GUI_PROPS="-p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true"

          mkdir -p dist
          for rid in win-x64 linux-x64 osx-arm64; do
            echo "::group::$rid"

            # SiteModules (the built-in module) and its dependencies are bundled through Gui's project reference
            retry dotnet restore "$GUI_PROJECT" -r "$rid"
            dotnet publish "$GUI_PROJECT" -c Release -r "$rid" \
              --self-contained true --no-restore $COMMON_PROPS $GUI_PROPS \
              -o "out/$rid/app"

            ext=""
            if [ "$rid" = "win-x64" ]; then ext=".exe"; fi
            mv "out/$rid/app/Gui$ext" "out/$rid/app/NicheImageRipper$ext"

            find "out/$rid/app" -name '*.pdb' -delete

            # Single-file check: only the executable and the files deliberately kept out of the bundle
            # (selenium-manager, runtimes/<rid>/native) may be on disk
            loose=$(find "out/$rid/app" -maxdepth 1 -type f \( -name '*.dll' -o -name '*.so' -o -name '*.dylib' -o -name '*.json' \))
            if [ -n "$loose" ]; then
              echo "::error::$rid publish is not single-file; unexpected files next to the executable:"
              echo "$loose"
              exit 1
            fi
            echo "Published files:"
            (cd "out/$rid/app" && find . -type f | sort)

            (cd "out/$rid/app" && zip -r "../../../dist/NicheImageRipper-${{ steps.version.outputs.version }}-$rid.zip" .)

            echo "::endgroup::"
          done

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*.zip